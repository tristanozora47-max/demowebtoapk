name: Build APK (Flutter / Gradle / Web2APK Auto)

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Job ID from Bot'
        required: true
      userId:
        description: 'User ID'
        required: true
      payload:
        description: 'Build Payload (JSON)'
        required: true
      build_type:
        description: 'release / debug'
        required: false
        default: 'release'

concurrency:
  group: build-${{ github.event.inputs.jobId }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=true
        -Dorg.gradle.caching=true
        -Dorg.gradle.configureondemand=true
        -Dorg.gradle.workers.max=4
        -Dorg.gradle.jvmargs=-Xmx3g

    steps:
      - name: Parse payload
        run: |
          set -euo pipefail
          echo '${{ github.event.inputs.payload }}' > payload.json
          cat payload.json

          MODE=$(jq -r '.mode // empty' payload.json)
          if [ -z "$MODE" ]; then
            if jq -e '.appName' payload.json >/dev/null 2>&1; then MODE="url"; else MODE="zip"; fi
          fi
          echo "MODE=$MODE" >> "$GITHUB_ENV"

          if [ "$MODE" = "url" ]; then
            WEB_URL=$(jq -r '.url // empty' payload.json)
            APP_NAME=$(jq -r '.appName // "WebApp"' payload.json)
            ICON_URL=$(jq -r '.iconUrl // empty' payload.json)
            if [ -z "$WEB_URL" ]; then
              echo "::error::mode=url tapi gak ada 'url' website di payload"
              exit 1
            fi
            echo "WEB_URL=$WEB_URL" >> "$GITHUB_ENV"
            echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
            echo "ICON_URL=$ICON_URL" >> "$GITHUB_ENV"
            echo "✅ Mode: Web2APK -> $WEB_URL ($APP_NAME)"
          else
            ZIP_URL=$(jq -r '.zipAssetUrl // .url // empty' payload.json)
            if [ -z "$ZIP_URL" ]; then
              echo "::error::Tidak ada zipAssetUrl / url di payload"
              exit 1
            fi
            echo "ZIP_URL=$ZIP_URL" >> "$GITHUB_ENV"
            echo "✅ Mode: ZIP project -> $ZIP_URL"
          fi

      - name: Download & extract ZIP
        if: env.MODE == 'zip'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf project_raw project.zip
          mkdir -p project_raw

          if [[ "$ZIP_URL" == *"api.github.com"* ]]; then
            curl -fL --retry 3 --retry-delay 5 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              -o project.zip "$ZIP_URL"
          else
            curl -fL --retry 3 --retry-delay 5 -o project.zip "$ZIP_URL"
          fi

          ls -lh project.zip
          unzip -q project.zip -d project_raw

          echo "=== Struktur root project_raw ==="
          find project_raw -maxdepth 3 -type d | head -50
          echo ""
          echo "=== File kunci ==="
          find project_raw -maxdepth 6 -type f \
            \( -name "gradlew" -o -name "pubspec.yaml" \
               -o -name "settings.gradle" -o -name "settings.gradle.kts" \
               -o -name "build.gradle" -o -name "build.gradle.kts" \) \
            -not -path "*/build/*" | head -30

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('project_raw/**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('project_raw/**/*.gradle*', 'project_raw/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Detect / Generate project
        id: detect
        run: |
          set -euo pipefail

          if [ "$MODE" = "url" ]; then
            SAFE_NAME=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_]+/_/g' | sed -E 's/^[0-9]+/a&/')
            [ -z "$SAFE_NAME" ] && SAFE_NAME="webapp"
            export APP_NAME WEB_URL
            DART_APP_NAME=$(python3 -c "import os,sys; s=os.environ['APP_NAME']; s=s.replace(chr(92),chr(92)*2).replace(chr(39),chr(92)+chr(39)); sys.stdout.write(s)")
            XML_APP_NAME=$(python3 -c "import os,sys; s=os.environ['APP_NAME']; sys.stdout.write(''.join(c for c in s if c not in '&<>'+chr(34)))")
            WEB_URL_SAFE=$(python3 -c "import os,sys; sys.stdout.write(os.environ['WEB_URL'].replace(chr(39),'%27'))")

            mkdir -p project_raw
            cd project_raw
            echo "🛠️  flutter create $SAFE_NAME ..."
            flutter create --org com.ziperr --project-name "$SAFE_NAME" --platforms=android --no-pub "$SAFE_NAME" >/dev/null
            cd "$SAFE_NAME"

            echo "📦 Nambah webview_flutter ..."
            flutter pub add webview_flutter

            HAS_ICON=false
            if [ -n "$ICON_URL" ]; then
              mkdir -p assets
              if curl -fsSL --max-time 20 "$ICON_URL" -o assets/icon.png && [ -s assets/icon.png ]; then
                HAS_ICON=true
                echo "🎨 Icon custom terdeteksi, nambah flutter_launcher_icons ..."
                flutter pub add dev:flutter_launcher_icons
                printf 'flutter_launcher_icons:\n  android: true\n  ios: false\n  image_path: "assets/icon.png"\n' > flutter_launcher_icons.yaml
              else
                echo "::warning::Gagal download icon dari $ICON_URL, pakai icon default Flutter."
              fi
            fi

            if [ "$HAS_ICON" = "true" ]; then
              echo "🎨 Generate launcher icon ..."
              dart run flutter_launcher_icons || echo "::warning::flutter_launcher_icons gagal, lanjut pakai icon default."
            fi

            # ==== TULIS lib/main.dart PAKAI HEREDOC (FIX!) ====
            cat > lib/main.dart << 'DART_EOF'
import 'package:flutter/material.dart';
import 'package:webview_flutter/webview_flutter.dart';

void main() => runApp(const WebApp());

class WebApp extends StatelessWidget {
  const WebApp({super.key});
  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      title: '__APP_NAME__',
      debugShowCheckedModeBanner: false,
      theme: ThemeData(useMaterial3: true),
      home: const WebViewPage(),
    );
  }
}

class WebViewPage extends StatefulWidget {
  const WebViewPage({super.key});
  @override
  State<WebViewPage> createState() => _WebViewPageState();
}

class _WebViewPageState extends State<WebViewPage> {
  late final WebViewController controller;

  @override
  void initState() {
    super.initState();
    controller = WebViewController()
      ..setJavaScriptMode(JavaScriptMode.unrestricted)
      ..loadRequest(Uri.parse('__WEB_URL__'));
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      body: SafeArea(child: WebViewWidget(controller: controller)),
    );
  }
}
DART_EOF

            # Replace placeholder pakai sed (pake | biar aman dari / dan &)
            python3 -c "
import os
app_name = os.environ.get('APP_NAME', 'WebApp')
web_url = os.environ.get('WEB_URL', '')
with open('lib/main.dart', 'r') as f:
    content = f.read()
content = content.replace('__APP_NAME__', app_name.replace('\\', '\\\\').replace(chr(39), chr(92)+chr(39)))
content = content.replace('__WEB_URL__', web_url.replace(chr(39), '%27'))
with open('lib/main.dart', 'w') as f:
    f.write(content)
"

            sed -i "s/android:label=\"[^\"]*\"/android:label=\"${XML_APP_NAME}\"/" android/app/src/main/AndroidManifest.xml

            echo "type=flutter" >> "$GITHUB_OUTPUT"
            echo "dir=project_raw/$SAFE_NAME" >> "$GITHUB_OUTPUT"
            echo "✅ Web2APK project di-generate -> project_raw/$SAFE_NAME"

          else
            PUBSPEC=$(find project_raw -type f -name pubspec.yaml \
                      -not -path "*/build/*" -not -path "*/.dart_tool/*" | head -n 1)
            GRADLEW=$(find project_raw -type f -name gradlew \
                      -not -path "*/build/*" | head -n 1)
            SETTINGS=$(find project_raw -type f \
                      \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
                      -not -path "*/build/*" | head -n 1)

            echo "pubspec : ${PUBSPEC:-<none>}"
            echo "gradlew : ${GRADLEW:-<none>}"
            echo "settings: ${SETTINGS:-<none>}"

            if [ -n "$PUBSPEC" ]; then
              DIR=$(dirname "$PUBSPEC")
              echo "type=flutter" >> "$GITHUB_OUTPUT"
              echo "dir=$DIR"     >> "$GITHUB_OUTPUT"
              echo "✅ Flutter project → $DIR"
            elif [ -n "$GRADLEW" ]; then
              DIR=$(dirname "$GRADLEW")
              echo "type=gradle"  >> "$GITHUB_OUTPUT"
              echo "dir=$DIR"     >> "$GITHUB_OUTPUT"
              echo "✅ Native Gradle project → $DIR"
            elif [ -n "$SETTINGS" ]; then
              DIR=$(dirname "$SETTINGS")
              echo "type=gradle"  >> "$GITHUB_OUTPUT"
              echo "dir=$DIR"     >> "$GITHUB_OUTPUT"
              echo "✅ Gradle project (no wrapper) → $DIR"
            else
              echo "::error::Project tidak dikenali (bukan Flutter / bukan Gradle)."
              find project_raw -maxdepth 3
              exit 1
            fi
          fi

      - name: Tune gradle.properties
        run: |
          set -euo pipefail
          if [ "${{ steps.detect.outputs.type }}" = "flutter" ]; then
            GP="${{ steps.detect.outputs.dir }}/android/gradle.properties"
          else
            GP="${{ steps.detect.outputs.dir }}/gradle.properties"
          fi
          mkdir -p "$(dirname "$GP")"
          touch "$GP"
          sed -i '/org.gradle.jvmargs/d;/org.gradle.parallel/d;/org.gradle.caching/d;/org.gradle.daemon/d;/org.gradle.configureondemand/d;/org.gradle.workers.max/d' "$GP" || true
          {
            echo ""
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
            echo "org.gradle.parallel=true"
            echo "org.gradle.caching=true"
            echo "org.gradle.daemon=false"
            echo "org.gradle.configureondemand=true"
            echo "org.gradle.workers.max=4"
          } >> "$GP"

      - name: Build Flutter APK
        if: steps.detect.outputs.type == 'flutter'
        working-directory: ${{ steps.detect.outputs.dir }}
        run: |
          set -euo pipefail
          flutter config --no-analytics >/dev/null 2>&1 || true
          [ "$MODE" != "url" ] && flutter pub get
          BT="${{ github.event.inputs.build_type }}"
          [ -z "$BT" ] && BT=release
          flutter build apk --$BT \
            --target-platform=android-arm64 \
            --no-tree-shake-icons \
            --no-shrink \
            --no-pub 2>&1 | tee build.log

      - name: Build Native APK
        if: steps.detect.outputs.type == 'gradle'
        working-directory: ${{ steps.detect.outputs.dir }}
        run: |
          set -euo pipefail
          BT="${{ github.event.inputs.build_type }}"
          [ -z "$BT" ] && BT=release
          if [ "$BT" = "debug" ]; then TASK="assembleDebug"; else TASK="assembleRelease"; fi

          if [ -f gradlew ]; then
            chmod +x gradlew
            CMD="./gradlew"
            echo "✅ Pakai gradle wrapper"
          else
            echo "⚠️ gradlew tidak ada, generate wrapper dulu"
            gradle wrapper --gradle-version 8.7 || true
            if [ -f gradlew ]; then
              chmod +x gradlew
              CMD="./gradlew"
            else
              CMD="gradle"
            fi
          fi

          echo "Running: $CMD $TASK"
          $CMD "$TASK" \
            --parallel --build-cache \
            -Pandroid.injected.build.abi=arm64-v8a 2>&1 | tee build.log || {
              echo "::error::Build gagal. Cek log di atas."
              tail -100 build.log
              exit 1
            }

      - name: Debug - scan all APK
        if: failure()
        run: |
          echo "=== SEMUA APK di project_raw ==="
          find project_raw -type f -name "*.apk" -exec ls -lh {} \; 2>/dev/null || echo "TIDAK ADA APK"
          echo ""
          echo "=== Tree project_raw/app/build/outputs ==="
          find project_raw -type d -name "outputs" -exec find {} -maxdepth 3 -type d \; 2>/dev/null || true
          echo ""
          echo "=== File di outputs ==="
          find project_raw -type d -name "outputs" -exec find {} -type f \; 2>/dev/null || true

      - name: Locate APK
        id: locate
        run: |
          set -euo pipefail
          APK=""

          if [ "${{ steps.detect.outputs.type }}" = "flutter" ]; then
            LOG="${{ steps.detect.outputs.dir }}/build.log"
            if [ -f "$LOG" ]; then
              REL=$(grep -oE 'Built [^ ]+\.apk' "$LOG" | tail -n1 | sed -E 's/^Built //')
              if [ -n "$REL" ]; then
                CAND="${{ steps.detect.outputs.dir }}/$REL"
                if [ -f "$CAND" ]; then
                  APK="$CAND"
                  echo "✅ APK dari build.log (path resmi Flutter): $APK"
                else
                  echo "⚠️ build.log nyebut '$REL' tapi file-nya gak ada di $CAND"
                fi
              else
                echo "⚠️ Gak nemu baris 'Built ...apk' di build.log"
              fi
            fi
          fi

          if [ -z "$APK" ]; then
            echo "↩️ Fallback strategy 1 (exclude intermediates/tmp/kotlin/.gradle)"
            APK=$(find project_raw -type f -name "*.apk" \
                  -not -path "*/intermediates/*" \
                  -not -path "*/tmp/*" \
                  -not -path "*/kotlin/*" \
                  -not -path "*/.gradle/*" \
                  2>/dev/null | head -n 1 || true)
          fi
          if [ -z "$APK" ]; then
            echo "↩️ Fallback strategy 2 (include intermediates)"
            APK=$(find project_raw -type f -name "*.apk" \
                  -not -path "*/.gradle/*" \
                  2>/dev/null | head -n 1 || true)
          fi
          if [ -z "$APK" ]; then
            echo "↩️ Fallback strategy 3 (flutter-build path)"
            APK=$(find project_raw -type f -name "*.apk" \
                  -path "*/flutter-build/*" \
                  2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$APK" ]; then
            echo "::error::APK tidak ditemukan setelah semua strategy."
            echo "=== Isi build.log (100 baris terakhir) ==="
            tail -100 "${{ steps.detect.outputs.dir }}/build.log" 2>/dev/null || echo "(build.log tidak ada)"
            echo ""
            echo "=== Full tree project_raw/app/build ==="
            find project_raw -type d -name "build" -exec find {} -maxdepth 4 -type d \; 2>/dev/null | head -50 || true
            echo ""
            echo "=== Semua file .apk (full scan) ==="
            find / -type f -name "*.apk" 2>/dev/null | grep -v "/proc/" | head -20 || true
            exit 1
          fi

          APK_DIR=$(dirname "$APK")
          APK_SIZE=$(stat -c%s "$APK" 2>/dev/null || echo "0")
          echo "✅ APK ditemukan: $APK"
          echo "📁 Folder: $APK_DIR"
          echo "📦 Size: $APK_SIZE bytes"

          if [ "$APK_SIZE" -lt 1000 ]; then
            echo "::error::APK terlalu kecil ($APK_SIZE bytes), kemungkinan corrupt."
            exit 1
          fi

          echo "APK_DIR=$APK_DIR" >> "$GITHUB_ENV"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.jobId }}
          path: ${{ env.APK_PATH }}
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.event.inputs.jobId }}
          path: |
            ${{ steps.detect.outputs.dir }}/build.log
            ${{ steps.detect.outputs.dir }}/android/build.log
          if-no-files-found: ignore
          retention-days: 1